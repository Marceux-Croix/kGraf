# cargo-deny configuration. `cargo deny check licenses` enforces the same
# accepted-license list as about.toml (used by scripts/third-party-notices.sh).
# The two lists must match: change one, change the other.

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Apache-2.0 WITH LLVM-exception",
]
# kGraf's own crates are unpublished; skip them as about.toml does.
private = { ignore = true }
