# Windows target: static CRT linking.
#
# Both kgraf.exe and kgraf-app.exe imported VCRUNTIME140.dll from the dynamic MSVC C
# runtime, and scripts/package-windows.sh shipped neither that DLL nor a redistributable
# installer for it. On a bare Windows machine without the Visual C++ Redistributable
# already installed, both executables would fail to launch at all (a missing-DLL error
# dialog), which is worse than the "unsigned binary" SmartScreen warning this project
# already documents as a known gap.
#
# `target-feature=+crt-static` statically links the CRT into the binary instead
# (supported for `*-pc-windows-msvc` targets since Rust 1.19), removing the
# VCRUNTIME140.dll/MSVCP140.dll import entirely -- scripts/package-windows.sh's
# llvm-objdump -p check asserts this on every packaged executable, so a future
# regression here (e.g. a dependency that forces dynamic CRT linking back on) fails the
# build instead of silently reintroducing the missing-DLL failure on a real machine.
#
# Only x86_64-pc-windows-msvc is pinned here: this project ships no other Windows
# target, and static CRT linking has known trade-offs (a larger binary, and every
# process gets its own copy of CRT globals) that are a deliberate, scoped choice for
# this one target, not a workspace-wide default.
#
# Main-thread stack. Windows reserves 1 MB for an executable's main thread unless the
# PE header asks for more; macOS and Linux give 8 MB. A debug build of `kgraf` needs
# more than 1 MB just to parse its command line (clap builds the whole subcommand tree
# on the main thread), so every command died with STACK_OVERFLOW (0xC00000FD) before
# it printed anything. `/STACK:8388608` raises the reserve to 8 MB for every binary
# in the workspace, test binaries and the GUI included. A linker flag is used, not a
# worker thread, because the GUI event loop must stay on the main thread. Pages are
# reserved, not committed, so a binary that never uses the space pays nothing.
# This line sets rustflags for the target; a RUSTFLAGS environment variable replaces it,
# so a build that sets RUSTFLAGS must repeat both flags.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/STACK:8388608"]
