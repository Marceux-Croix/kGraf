version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # rmcp's streamable HTTP client returns its own sse-stream 0.2 types,
      # so kgraf-mcp must stay on sse-stream 0.2 until rmcp moves to 0.3.
      - dependency-name: sse-stream
        versions: [">=0.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
