# Windows self-test on a GitHub-hosted Windows machine.
#
# Manual trigger only: gh workflow run wintest.yml. There is no push,
# pull_request or schedule trigger.
#
# What it runs:
#   1. Builds the self-test bundle natively with scripts/package-wintest.sh
#      (every workspace test binary, kgraf.exe, the kgraf-wintest runner).
#   2. Copies the bundle to C:\kgraf-wintest, outside the runner account's
#      profile, where every local user may read and run it; starts the
#      OpenSSH agent service; checks Git for Windows.
#   3. Runs the copy with `kgraf-wintest.exe --all --no-wait`, and with the
#      sandbox_user input on (the default) also `--sandbox-user`: after the
#      suite, which runs with no sandbox user as the baseline, the runner sets
#      the Windows sandbox user up (`--slots 4`), re-runs the parts it changes
#      with KGRAF_REQUIRE_SANDBOX_USER=1 and removes it.
#   4. Runs the Windows Firewall network test (scripts/wintest-firewall.ps1).
#   5. Uploads the report and the firewall output as one artifact.
#
# Probe-only mode (probe_only=true): runs only the AppContainer DNS probe and
# the upload. It checks out the scripts folder, installs no Rust and builds
# nothing; every other step is skipped. The artifact holds
# appcontainer-dns.md and the raw capture files in appcontainer-dns-raw/.
#
# Cost: standard GitHub-hosted runners are free for public repositories; a
# private copy bills Windows minutes at twice the Linux rate. The job stops
# after 165 minutes.
#
# Time: the runner gets a wall-clock budget (--budget-mins) so that it stops
# starting work early enough to remove the sandbox user and write the report
# before the job limit. The budget is the job limit, less the minutes the job
# already used when the bundle starts, less the minutes the steps after the
# bundle need. Measured (runs of 2026-10-10 and 2026-10-11): the steps before
# the bundle took 20 to 22.5 minutes (cache restore, native build, copy); the
# steps after it took about 9 minutes (the firewall test 5 s, the AppContainer
# DNS probe 86 s, the upload 3 s, the cache save 7 minutes 10 s). A complete
# bundle run took 78 minutes in the faster of two measured runs. The slower
# one was at 78 minutes with one re-run of the sandbox user phase still
# running and two to go (baseline 48 minutes), which projects to about 113
# minutes. A full run of 2026-10-11 took 102.5 minutes in the bundle (22.5
# before it, 2.5 after) and still left the contract_checks re-run unstarted:
# whole re-runs took 2,489 s of its 2,668 s sandbox user phase. The re-run now
# runs only the tests that failed in the baseline of each binary that is not a
# sandbox test binary; timed per test on a development machine, those tests
# are 66 % of kgraf_host#rest, 18 % of contract_flow, 74 % of contract_checks
# and 93 % of the bench-briefs library, which projects that run to 97 to 107
# minutes of bundle with contract_checks included (its whole re-run measured
# 600 s and 1,463 s). With the steps before and after, a complete run needs
# 122 to 139 minutes of the job. The limit is 165, so the slower case keeps a
# margin of about 20 minutes; a job uses only the minutes it runs.
#
# Two things differ from a standard user's machine, so read the results with
# them in mind:
#   - The runner account is elevated (administrator). A standard user is not.
#   - The runner has Git for Windows (Git Bash) installed, so tools that need
#     `sh` find it. A machine without Git for Windows does not have them.
#
# A failing test does not fail the job: the report is the result. The job
# fails when the build fails or when no report file was written.
name: Windows self-test

on:
  workflow_dispatch:
    inputs:
      sandbox_user:
        description: "Also run the sandbox user phase (setup, status, selfcheck, re-run, remove) after the suite"
        type: boolean
        default: true
      only:
        description: "Run only these (kgraf-wintest --only): comma-separated binary-id or binary-id::test-name items; e2e or e2e::<check-id> adds end-to-end checks. Empty runs everything"
        type: string
        default: ""
      appcontainer_dns:
        description: "Also run the AppContainer DNS probe (scripts/wintest-appcontainer-dns.ps1)"
        type: boolean
        default: true
      probe_only:
        description: "Run only the AppContainer DNS probe and the upload: no build, bundle, tests or sandbox user steps"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wintest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep equal to `timeout-minutes` below: the job limit cannot read this
  # value, and the budget is computed from it.
  WINTEST_JOB_MINUTES: "165"
  # Minutes the steps after the bundle need: about 9 measured, plus 3.
  WINTEST_AFTER_BUNDLE_MINUTES: "12"

jobs:
  wintest:
    name: Windows self-test
    runs-on: windows-latest
    timeout-minutes: 165
    steps:
      # The budget counts from here. The job's own set-up before this step
      # takes a few seconds, which the minute taken off the budget covers.
      - name: Note the job start
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: echo "WINTEST_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Some tracked benchmark logs have paths longer than 260 characters;
      # without long paths, Git cannot check them out on Windows.
      - name: Allow long paths in Git
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The probe needs only the scripts folder; the full checkout is for
          # the build. An empty value checks out everything.
          sparse-checkout: ${{ inputs.probe_only && 'scripts' || '' }}
      # The same moving `stable` alias that ci.yml uses; see the comment there.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09-26
        if: ${{ !inputs.probe_only }}
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.probe_only }}
        with:
          # The package script builds in its own target folder.
          workspaces: ". -> target/wintest"

      - name: Build the self-test bundle
        id: build
        if: ${{ !inputs.probe_only }}
        shell: bash
        env:
          KGRAF_WINTEST_NATIVE: "1"
          JOBS: "4"
        run: scripts/package-wintest.sh

      # The sandbox user phase starts the test binaries as local sandbox
      # users, which cannot read the runner account's profile. The checkout
      # (GITHUB_WORKSPACE) is normally outside the profile, but its access
      # list is the image's, not ours. So the bundle runs from a copy in
      # C:\kgraf-wintest with a protected list: full control for SYSTEM and
      # Administrators, read and execute for Users (every local user, the
      # sandbox users included). The runner's preflight checks the list again
      # and names the sandbox group if it cannot read the binaries. The
      # baseline runs from the same copy, so both halves run the same files.
      - name: Place the bundle outside the profile
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Get-ChildItem target/wintest/bundle -Directory -Filter 'kgraf-wintest-*' | Select-Object -First 1).FullName
          Write-Output "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Output "USERPROFILE: $env:USERPROFILE"
          $inProfile = $stage.ToLower().StartsWith(($env:USERPROFILE.TrimEnd('\') + '\').ToLower())
          Write-Output "bundle built at $stage; inside the profile: $inProfile"
          Write-Output "access list of the built tests folder:"
          icacls (Join-Path $stage 'tests')
          $dest = 'C:\kgraf-wintest'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory $dest | Out-Null
          icacls $dest /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX'
          if ($LASTEXITCODE -ne 0) { throw "icacls could not set the access list of $dest" }
          Copy-Item -Recurse (Join-Path $stage '*') $dest
          # The owner of a folder or a file may rewrite its access list
          # whatever that list says. This folder and everything copied into
          # it is created by the job's own account, so the owner is that
          # account until this runs. Setup refuses to install the launcher
          # service from a path whose owner is not SYSTEM, the Administrators
          # group or TrustedInstaller, so the owner is set to the
          # Administrators group here, for the folder and for every file and
          # folder below it.
          icacls $dest /setowner '*S-1-5-32-544' /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls could not set the owner of $dest" }
          Write-Output "access list of the copy's tests folder:"
          icacls (Join-Path $dest 'tests')
          Write-Output "owner of the copy and of its program, which the launcher service checks:"
          # Diagnostics only: a missing file is reported, never a job failure.
          (Get-Acl $dest).Owner
          $program = Join-Path $dest 'programs\kgraf.exe'
          if (Test-Path $program) { (Get-Acl $program).Owner } else { Write-Output "not found: $program" }
          Write-Output "access list of the volume root, which the same check reads:"
          icacls C:\

      # What the sandbox user phase needs on the machine. Each fails the job
      # loudly: a missing piece would turn a test into a skip or a failure
      # that measures nothing.
      - name: Start the OpenSSH agent and check Git for Windows
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The escape tests probe the agent's pipe; the service is disabled
          # on the hosted image.
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          $s = Get-Service ssh-agent
          if ($s.Status -ne 'Running') { throw "the ssh-agent service did not start: $($s.Status)" }
          Write-Output "ssh-agent: $($s.Status)"
          # Git for Windows, for Git Bash and the TLS test.
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git for Windows is not installed: no $bash" }
          git --version

      - name: Run the bundle
        if: ${{ !inputs.probe_only }}
        shell: bash
        env:
          # The runner is elevated and throwaway, so the sandbox user setup
          # test may create its tagged test users and firewall rules.
          KGRAF_SANDBOX_SETUP_TEST: "1"
          SANDBOX_USER: ${{ inputs.sandbox_user }}
          # Passed through the environment, never pasted into the script.
          ONLY: ${{ inputs.only }}
        run: |
          set -u
          # The runner's budget: the job limit, less the whole minutes used
          # so far, less the steps after this one, less one minute for the
          # part minute dropped and the job set-up. Never under 10.
          used=$(( ( $(date +%s) - WINTEST_JOB_START ) / 60 ))
          budget=$(( WINTEST_JOB_MINUTES - used - WINTEST_AFTER_BUNDLE_MINUTES - 1 ))
          if (( budget < 10 )); then budget=10; fi
          echo "job minutes $WINTEST_JOB_MINUTES, used $used, budget for the runner $budget"
          stage="/c/kgraf-wintest"
          report_dir="$GITHUB_WORKSPACE/wintest-out/report"
          mkdir -p "$report_dir"
          cd "$stage"
          # A failed test is a result, not a job failure.
          extra=()
          if [[ "$SANDBOX_USER" == "true" ]]; then extra+=(--sandbox-user); fi
          if [[ -n "$ONLY" ]]; then extra+=(--only "$ONLY"); fi
          extra+=(--budget-mins "$budget")
          ./kgraf-wintest.exe --all --no-wait "${extra[@]}" --report-dir "$(cygpath -w "$report_dir")" || echo "kgraf-wintest.exe exited with $?"
          # The report file is the result: no file, no result.
          if ! ls "$report_dir"/kgraf-wintest-report-*.md >/dev/null 2>&1; then
            echo "no report file in $report_dir" >&2
            ls -la "$report_dir" >&2
            exit 1
          fi
          ls -la "$report_dir"

      - name: Run the firewall network test
        # It runs the sandbox from the bundle, so it needs the build.
        if: ${{ !cancelled() && !inputs.probe_only && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $stage = (Get-ChildItem target/wintest/bundle -Directory -Filter 'kgraf-wintest-*' | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force wintest-out | Out-Null
          # The runner account is already an administrator; the script
          # reports whether the process is elevated.
          & scripts/wintest-firewall.ps1 -Bundle $stage -Out "$env:GITHUB_WORKSPACE\wintest-out\firewall.txt"
          exit 0

      - name: Run the AppContainer DNS probe
        if: ${{ !cancelled() && (inputs.appcontainer_dns || inputs.probe_only) }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wintest-out | Out-Null
          & scripts/wintest-appcontainer-dns.ps1 -Out "$env:GITHUB_WORKSPACE\wintest-out\appcontainer-dns.md"
          exit 0

      # Also after a cancel or a timeout: a partial report is a result.
      - name: Upload the report, the firewall output and the probe files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kgraf-windows-selftest
          path: wintest-out/
          if-no-files-found: error
          retention-days: 14
