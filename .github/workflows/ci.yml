# Validation gates: fmt check, clippy -D warnings, test.
# Ubuntu-only by design: in a private copy macOS and Windows runners bill at
# a higher per-minute rate than Linux. Cross-platform build
# correctness is instead exercised by the release workflow's per-platform
# matrix (.github/workflows/release.yml), which runs only when started by hand
# from a version tag. See scripts/release-local.md for a local Linux/macOS/
# Windows build path that costs no Actions minutes at all.
name: CI

# Manual runs only (workflow_dispatch): no push or pull request starts this
# workflow. The same gates run locally before every push.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'

# No job here writes to the repository; read is enough for checkout.
permissions:
  contents: read

# Cancel superseded runs on the same ref so redundant pushes to an open PR
# do not burn minutes twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dtolnay/rust-toolchain's `stable` branch is an intentional moving
      # target: the repo pushes a new commit to it on every Rust stable
      # release, with no separate version tags for that alias, so pinning a
      # SHA here freezes the toolchain version until this line is bumped by
      # hand (checked at the source, 2026-09-26; no Dependabot ecosystem
      # tracks this repo's branch moves the way it tracks tags).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09-26
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09-26
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop app links the X11 and Wayland windowing libraries on
      # Linux; the same list as scripts/package-linux.sh.
      - name: Install the Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libglib2.0-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09-26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop app links the X11 and Wayland windowing libraries on
      # Linux; the same list as scripts/package-linux.sh.
      - name: Install the Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libssl-dev libglib2.0-dev
      - run: cargo test --workspace
