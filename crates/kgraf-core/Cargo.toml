[package]
name = "kgraf-core"
version.workspace = true
description = "Shared identifiers, errors and the token-accounting normal form for kGraf."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
# `paths`: names compared as APFS and NTFS resolve them (NFC). Moved here from
# kgraf-runtime so kgraf-sandbox's merge-back applies the same rule (0062).
unicode-normalization = "0.1.25"

# `child_run`: a child leads its own process group, killed with `killpg`, and
# exit is awaited without reaping (`waitid` with `WNOWAIT`). Already in
# Cargo.lock and used by kgraf-sandbox and kgraf-host for the same calls.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `child_run`: a child and what it starts run in a job object, ended as one.
# The release kgraf-sandbox already pins; only the four features it needs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# Test helpers for other crates' tests: `flock::Forkers` (a fork-pressure helper for
# lock-release tests, Unix only) and `session::check_session_records` (the record
# check for session files).
test-support = []

[dev-dependencies]
# Throwaway repositories for the host git mechanism tests. Already in Cargo.lock.
tempfile = "3.27.0"
