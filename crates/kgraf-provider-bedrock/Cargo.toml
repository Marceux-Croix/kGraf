[package]
name = "kgraf-provider-bedrock"
version.workspace = true
description = "AWS Bedrock Converse adapter: SigV4-signed Converse and ConverseStream, additive usage, cache points."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kgraf-core.workspace = true
kgraf-provider.workspace = true
kgraf-secrets.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
tokio.workspace = true
# SigV4 signer and the event-stream frame decoder: AWS's own maintained crates
# (Apache-2.0, smithy-rs). The credential provider chain (`aws-config`) is not
# used; see the crate documentation.
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"
aws-smithy-eventstream = "0.61"
aws-smithy-types = "1"
bytes = "1"
http = "1"

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
# An independent SigV4 verifier for the signing tests: it recomputes the signature a
# server would, so the tests do not check the signer against itself.
sha2.workspace = true
