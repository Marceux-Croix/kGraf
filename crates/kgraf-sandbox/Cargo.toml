[package]
name = "kgraf-sandbox"
version.workspace = true
description = "Sandboxed execution: worktrees and per-platform isolation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `flock::HeldLock`: hold locks released by an explicit unlock, shared with
# the session and orchestrator crates.
kgraf-core = { path = "../kgraf-core" }
# `impl DiagCode` for this crate's errors (decision 0069). No cycle: kgraf-diag
# depends on nothing in this workspace but kgraf-core.
# `SECRET_NAME_NEEDLES`, the one place a variable name is judged
# credential-shaped, shared with this crate's inherited-environment scrub so
# the two never drift apart.
kgraf-secrets = { path = "../kgraf-secrets" }
kgraf-diag = { path = "../kgraf-diag" }
thiserror = "2.0.17"
# MIT OR Apache-2.0; already in Cargo.lock (kgraf-host, kgraf-shell). Parses the
# user's cargo config to pass its non-secret settings into the sandbox.
toml = "1.1.6"
# MIT OR Apache-2.0, verified on crates.io 2026-09-26; already in Cargo.lock.
# Merge-back folds paths to NFC to detect normalization-only collisions.
# Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT, read from the crate's
# Cargo.toml 2026-09-26; already in Cargo.lock under cap-std, which kgraf-tools
# uses for the same reason. Merge-back removes what a check left in a worktree from
# the host, outside the sandbox: every directory is opened no-follow relative to its
# parent's descriptor (`open_dir_nofollow`) and every entry is unlinked relative to
# it, so a check process that swaps a directory for a symlink cannot steer a removal
# outside the worktree . cap-primitives rather than cap-std:
# cap-std's `Dir` has no no-follow directory open. rustix (also in the lock) was the
# other candidate, rejected because it is unix-only and this crate builds for
# Windows. Descriptor-relative path handling is reused, not hand-rolled.
cap-primitives = "4.0.3"
# The sandbox user's password and the setup pipe's nonce come from the system
# random source (BCryptGenRandom on Windows). Same pin as kgraf-diag; MIT OR
# Apache-2.0, already in Cargo.lock.
getrandom = "0.4"
# Clears the sandbox user's password from memory when it is dropped. Apache-2.0
# OR MIT, read from the crate's Cargo.toml 2026-10-08; already in Cargo.lock.
zeroize = "1.9.0"
# Finds the per-user configuration folder that holds the stored sandbox
# passwords, the folder `kgraf sandbox setup` writes them to. Already a
# workspace dependency (kgraf-diag, kgraf-cli).
directories.workspace = true

[target.'cfg(unix)'.dependencies]
# Process liveness (`kill(pid, 0)`) for orphan detection; the lock reason
# records the owning PID.
libc = "0.2.185"

[target.'cfg(target_os = "linux")'.dependencies]
# MIT OR Apache-2.0, verified on crates.io 2026-09-26. The reuse
# candidate for Linux isolation.
landlock = "0.4.7"
# Apache-2.0 OR BSD-3-Clause, verified at the source (crates.io metadata and the
# crate's LICENSE files) 2026-09-26. The seccomp BPF compiler codex-rs
# `linux-sandbox` uses; default features only (no serde/json).
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
# MIT, read from the crate's Cargo.toml 2026-10-06 (github.com/tesuji/junction).
# Directory junctions for dependency links on Windows, where a symbolic link
# needs a privilege a user account lacks by default. Default features off:
# `unstable_admin` would enable the backup and restore privileges.
junction = { version = "2.1.0", default-features = false }
# MIT OR Apache-2.0, verified on crates.io 2026-09-26. 0.61.2 is the
# windows-sys release shipped with `windows` 0.62.2 (the sandboxing evidence's
# "pin to 0.62"; no windows-sys 0.62 exists). Already in Cargo.lock through
# other crates. `win32job` was not taken: it pulls `windows` 0.61 and
# thiserror 1, a second copy of each, for four job-object calls.
# `Wdk_Foundation`, `Wdk_Storage_FileSystem` and `Win32_System_IO`: host writes
# and removals in a worker's tree open each name relative to its folder's
# handle with `NtCreateFile` (`confined.rs`), never following a reparse point.
# `Win32_System_Threading` and `Win32_System_Registry` also serve owner liveness
# (`win_process.rs`): `OpenProcess`, `GetProcessTimes`, `WaitForSingleObject`,
# and `MachineGuid` through `RegGetValueW`. `Win32_System_SystemInformation`:
# the sandbox user's runner starts in the system folder (`GetSystemDirectoryW`).
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# MIT OR Apache-2.0, read from the crate's Cargo.toml 2026-10-08; the release
# windows-sys 0.61.2 ships with, already in Cargo.lock. The sandbox user's
# firewall rules go through the firewall's COM interfaces (`INetFwPolicy2`,
# `INetFwRule3`), which windows-sys does not bind.
windows = { version = "0.62.2", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
kgraf-core = { path = "../kgraf-core", features = ["test-support"] }
tempfile = "3.27.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(windows)'.dev-dependencies]
# The Windows escape-test probe calls these directly (desktop name, console,
# OpenProcess, registry, hard links, SendInput, waiting on a process handle).
# The Schannel tests ask for a TLS client credential under each token
# (`Authentication_Identity`, `Credentials`, and `Cryptography` for
# `SCHANNEL_CRED`). `Win32_System_Ioctl`: a confined-walk test turns a folder
# into a junction in place (`FSCTL_SET_REPARSE_POINT`).
# `Win32_Security_Authorization`: the probe reports the SID of the user it
# runs as, so a test can tell which sandbox user started it.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[[bench]]
name = "lifecycle"
harness = false
