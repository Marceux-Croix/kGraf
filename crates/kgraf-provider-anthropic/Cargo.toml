[package]
name = "kgraf-provider-anthropic"
version.workspace = true
description = "Anthropic-protocol adapter: additive usage, cache control, cumulative streaming usage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kgraf-core.workspace = true
kgraf-provider.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
wiremock.workspace = true
# The workspace's `tokio` omits `net`, which nothing outside a test needs. The
# slow-server tests below need a real `TcpListener` to prove the stream is
# read incrementally rather than buffered whole, so the feature is added here,
# dev-only, rather than widening the workspace default for every consumer.
tokio = { version = "1.53", features = ["net"] }
