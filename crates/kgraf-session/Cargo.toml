[package]
name = "kgraf-session"
version.workspace = true
description = "Session machinery: skills at run time, tool approval, the resumable transcript."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Explicit versions for third-party entries; the main session hoists them later.
[dependencies]
kgraf-core = { path = "../kgraf-core" }
kgraf-instructions = { path = "../kgraf-instructions" }
kgraf-tools = { path = "../kgraf-tools" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `JsonlTranscript` (ported from codex-rs `rollout/`, third_party/codex/UPSTREAM)
# appends and reads its file asynchronously so a worker's own I/O never blocks
# the runtime the rest of the loop shares.
tokio = { version = "1.53", features = ["fs", "io-util", "rt"] }

[target.'cfg(unix)'.dependencies]
# `flock`: `approval_store::FileLock` serializes concurrent `allow()`
# read-modify-writes, and `transcript::JsonlTranscript` holds
# an exclusive lock on its file for its own lifetime so a second writer is
# refused rather than silently interleaved. Matches the
# version kgraf-sandbox already pins, reusing an existing crate over
# writing new code.
libc = "0.2.189"

[dev-dependencies]
# `flock::Forkers`: fork pressure for the transcript's lock-release test.
kgraf-core = { path = "../kgraf-core", features = ["test-support"] }
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
tempfile = "3.27.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1"

[[bench]]
name = "session"
harness = false
